[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viscan-opg"
version = "1.0.0"
description = "AI-assisted 2D dental panoramic finding detection (OPG) for dentist clinical decision support."
authors = [{ name = "Viscan AI Engineer Candidate" }]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pycocotools>=2.0.7",
    "pydicom>=2.4.0",
    "nibabel>=5.1.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "trimesh>=4.0.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
