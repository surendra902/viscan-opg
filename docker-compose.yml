services:
  viscan:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - viscan-checkpoints:/app/checkpoints
      - viscan-results:/app/results
      - ./samples:/app/samples:ro
    environment:
      - VISCAN_WEIGHTS_PATH=/app/checkpoints/best_model.pth
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Opt-in: live raw-CBCT segmentation. Requires the Zenodo DentalSegmentator
  # weights under ./cbct_weights (dataset.json + fold_0/checkpoint_final.pth).
  # Start with: docker compose --profile cbct up viscan-cbct
  viscan-cbct:
    profiles: ["cbct"]
    build:
      context: .
      args:
        INSTALL_CBCT: "true"
    ports:
      - "8001:8000"
    volumes:
      - viscan-checkpoints:/app/checkpoints
      - viscan-results-cbct:/app/results
      - ./cbct_weights:/cbct_weights:ro
      - ./samples:/app/samples:ro
    environment:
      - VISCAN_WEIGHTS_PATH=/app/checkpoints/best_model.pth
      - VISCAN_CBCT_WEIGHTS_DIR=/cbct_weights
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  viscan-checkpoints:
  viscan-results:
  viscan-results-cbct:
